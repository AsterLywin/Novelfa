# Novelfa APK build on GitHub Actions.
#
# Why this exists: the Muse VM sandbox blocks Gradle's daemon
# loopback TCP (other_tcp Deny), so no APK can be built on the
# VM. GitHub's runners have no such block, so CI builds the APK
# and hands it back as an artifact.
#
# How to run: Actions tab -> "Build Novelfa APK" -> Run workflow,
# pick the variant. The APK appears under Artifacts on the run.
#
# Variants:
# - debug (default, no secrets needed): debug-signed APK. It does
#   NOT install over a release build: uninstall the release build
#   first, and take a .novelfabak backup first (uninstall wipes
#   app data).
# - release: signed with the release keystore. Needs 4 repository
#   secrets (Settings -> Secrets and variables -> Actions):
#     NOVELFA_KEYSTORE_BASE64  base64 of novelfa-release.keystore
#     NOVELFA_KEYSTORE_PASSWORD
#     NOVELFA_KEY_ALIAS        (novelfa)
#     NOVELFA_KEY_PASSWORD
#   The run fails loudly if any of them is missing, instead of
#   handing back an unsigned APK that cannot be installed.
name: Build Novelfa APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "APK variant to build"
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        # NOTE: do NOT use android-actions/setup-android here — v3
        # unconditionally runs `sdkmanager tools`, and the obsolete
        # `tools` package no longer exists, so the step fails
        # (run #1, 2026-11-08). The runner image already ships the
        # SDK + cmdline-tools; install only what AGP needs.
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Decode release keystore (release only)
        if: ${{ inputs.variant == 'release' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.NOVELFA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::NOVELFA_KEYSTORE_BASE64 secret is missing. Add the 4 NOVELFA_* secrets in repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/novelfa-release.keystore"

      - name: Build debug APK
        if: ${{ inputs.variant == 'debug' }}
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon -Djava.net.preferIPv4Stack=true

      - name: Build signed release APK
        if: ${{ inputs.variant == 'release' }}
        working-directory: android
        env:
          NOVELFA_KEYSTORE_PATH: ${{ runner.temp }}/novelfa-release.keystore
          NOVELFA_KEYSTORE_PASSWORD: ${{ secrets.NOVELFA_KEYSTORE_PASSWORD }}
          NOVELFA_KEY_ALIAS: ${{ secrets.NOVELFA_KEY_ALIAS }}
          NOVELFA_KEY_PASSWORD: ${{ secrets.NOVELFA_KEY_PASSWORD }}
        run: |
          for v in NOVELFA_KEYSTORE_PASSWORD NOVELFA_KEY_ALIAS NOVELFA_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::$v secret is missing."; exit 1; fi
          done
          gradle :app:assembleRelease --no-daemon -Djava.net.preferIPv4Stack=true

      - name: Upload debug APK
        if: ${{ inputs.variant == 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: novelfa-debug-vc17
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        if: ${{ inputs.variant == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: novelfa-release-1.0.0-17
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
