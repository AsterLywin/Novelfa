# Project-level build flags (portable — safe to commit).
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
org.gradle.caching=true
# AGP 8.5.2 references a UTP artifact that is not resolvable; disable UTP so
# :app:connectedAndroidTest can build. Remove once AGP is >= 8.6.
android.experimental.androidTest.useUnifiedTestPlatform=false
# CI run #3 (2026-11-08) died with OutOfMemoryError in the Kotlin
# daemon during IR lowering (LibraryScreenComponents.kt): the daemon
# runs at its small default heap. GitHub ubuntu runners have 16 GB
# RAM, so 4 GB each leaves ample headroom. Harmless for local builds.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
kotlin.daemon.jvmargs=-Xmx4g
